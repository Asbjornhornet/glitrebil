<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Selg bilen din | Glitre Bil</title>
  <link rel="stylesheet" href="/public/style.css" />
</head>
<body>

<section class="hero">

  <div class="overlay"></div>

  <div class="content">

    <h1>Selg bilen din på 2 minutter</h1>
    <p>Få tilbud raskt • Helt gratis • Ingen forpliktelser</p>

    <form id="form" class="form">

      <input id="regnr" placeholder="Skriv regnr (AB12345)" />
      <input id="bil" placeholder="Bil" />

      <input id="navn" placeholder="Navn" />
      <input id="telefon" placeholder="Telefon" />
      <input id="epost" placeholder="E-post" />

      <button>Få tilbud</button>

      <div id="loading">🔍 Henter bilinfo...</div>
      <div id="result"></div>

    </form>

    <p class="trust">
      ✔ Gratis vurdering  
      ✔ Rask respons  
      ✔ Trygg handel
    </p>

  </div>

</section>

<script src="/public/script.js"></script>
</body>
</html>
