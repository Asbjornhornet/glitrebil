<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />

</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="logo">Glitre Bil</div>
  <div class="menu">

    <a href="/verksted.html">Verksted</a>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">
    <h1>Glitre Bil</h1>
    <p>Kjøp og salg av bruktbil • Verksted • Deler</p>

    <form id="form" class="form">
      <input id="regnr" placeholder="Skriv regnr" />
      <input id="bil" placeholder="Bil" />
      <input id="navn" placeholder="Navn" />
      <input id="telefon" placeholder="Telefon" />

      <div id="loading">Henter data...</div>
      <div id="result"></div>
    </form>
  </div>
</section>

<!-- BILER -->
<section class="cars-section">
  <h2>Biler til salgs</h2>
  <div id="cars" class="grid"></div>
</section>

<!-- TJENESTER -->
<section class="services">
  <div class="card">🚗 Bruktbil</div>
  <div class="card">🛠 Verksted (Bosch)</div>
  <div class="card">🧰 Deler</div>
