<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glitre Bil</title>

<style>
body {
  margin:0;
  font-family: system-ui, Arial;
  background:#020617;
  color:white;
}

/* 🔥 HERO */
.hero {
  height:70vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(rgba(2,6,23,0.8), rgba(2,6,23,1)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');
  background-size:cover;
  background-position:center;
  text-align:center;
}

.hero h1 {
  font-size:56px;
  margin:0;
}

.hero p {
  opacity:0.7;
}

/* 🔥 FORM */
form {
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  width:320px;
}

input, button {
  padding:14px;
  border-radius:8px;
  border:none;
}

input {
  background:#111827;
  color:white;
}

button {
  background:linear-gradient(90deg,#2563eb,#3b82f6);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* 🔥 SECTION */
.section {
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

h2 {
  text-align:center;
  margin-bottom:40px;
}

/* 🔥 GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

/* 🔥 CARD */
.card {
  background:#111827;
  border-radius:18px;
  overflow:hidden;
  transition:0.3s;
  cursor:pointer;
}

.card:hover {
  transform:translateY(-6px);
}

.card img {
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content {
  padding:18px;
}

.card h3 {
  margin:0 0 10px;
  font-size:17px;
}

.meta {
  color:#9ca3af;
  font-size:14px;
  margin-bottom:10px;
}

.price {
  font-size:22px;
  font-weight:bold;
}

/* 🔥 BADGE */
.badge {
  position:absolute;
  background:#2563eb;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  top:10px;
  left:10px;
}

.card-wrapper {
  position:relative;
}
</style>
</head>

<body>

<!-- 🔥 HERO -->
<div class="hero">
  <h1>Glitre Bil</h1>
  <p>Gratis verdivurdering • Rask respons</p>

  <form>
<input id="regnr" placeholder="AB12345" />
<input id="car" placeholder="Bil" />
<input id="name" placeholder="Navn" />
<input id="phone" placeholder="Telefon" />
<input id="email" placeholder="E-post" />

<button id="submitBtn">Få tilbud</button>

<div id="carInfo"></div>
  </form>
</div>

<!-- 🔥 BILER -->
<div class="section">
  <h2>Biler til salgs</h2>
  <div id="cars" class="grid"></div>
</div>

<script>
  document.getElementById('regnr').addEventListener('input', async (e) => {
  const value = e.target.value.toUpperCase();

  if (value.length === 7) {
    try {
      const res = await fetch(`/api/regnr?regnr=${value}`);
      const data = await res.json();

      if (data.model) {
        alert(
          `${data.brand} ${data.model} (${data.year})\n${data.fuel} • ${data.power}`
        );
      }

    } catch (err) {
      console.log('lookup feil');
    }
  }
});
async function loadCars() {
  try {
    const res = await fetch('/api/cars');
    const cars = await res.json();

    const container = document.getElementById('cars');

    container.innerHTML = cars.map(car => `
      <div class="card" onclick="window.open('${car.url}', '_blank')">

        <div class="card-wrapper">
          <div class="badge">Til salgs</div>
          <img src="${car.image}" />
        </div>

        <div class="card-content">
          <h3>${car.title}</h3>

          <div class="meta">
            ${car.year} ${car.km ? '• ' + car.km : ''}
          </div>

          <div class="price">${car.price}</div>
        </div>

      </div>
    `).join('');

  } catch (err) {
    document.getElementById('cars').innerHTML = "Kunne ikke laste biler";
  }
}

loadCars();
</script>

</body>
</html>
