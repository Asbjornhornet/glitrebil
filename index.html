<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glitre Bil</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#020617;
  color:white;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
}

h1 {
  text-align:center;
  font-size:48px;
}

form {
  max-width:400px;
  margin:20px auto;
}

input, button {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  border:none;
}

button {
  background:#e5e7eb;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:40px;
}

.card {
  background:#111827;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.02);
}

.card img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content {
  padding:15px;
}

.card h3 {
  margin:0 0 10px;
  font-size:16px;
}

.meta {
  color:#9ca3af;
  font-size:14px;
  margin-bottom:10px;
}

.price {
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Selg bilen din</h1>
<p style="text-align:center">Gratis verdivurdering</p>

<form>
<input placeholder="AB12345">
<input placeholder="Navn">
<input placeholder="Telefon">
<input placeholder="E-post">
<button>Send</button>
</form>

<h2 style="text-align:center;margin-top:60px">Biler til salgs</h2>

<div id="cars" class="grid"></div>

</div>

<script>
async function loadCars() {
  try {
    const res = await fetch('/api/cars');
    const cars = await res.json();

    const container = document.getElementById('cars');

    container.innerHTML = cars.map(car => `
      <div class="card" onclick="window.open('${car.url}', '_blank')">

        <img src="${car.image}" />

        <div class="card-content">
          <h3>${car.title}</h3>

          <div class="meta">
            ${car.year || ''} ${car.km ? '• ' + car.km : ''}
          </div>

          <div class="price">${car.price}</div>
        </div>

      </div>
    `).join('');

  } catch (err) {
    document.getElementById('cars').innerHTML = "Kunne ikke laste biler";
  }
}

loadCars();
</script>

</body>
</html>
